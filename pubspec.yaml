name: strata
description: STRATA - Decentralized Peer-to-Peer Bandwidth Sharing

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^13.0.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.5.1
  firebase_auth_platform_interface: ^7.7.3
  cloud_firestore: ^5.6.0
  app_links: ^6.3.0
  workmanager: ^0.6.0
  skeletonizer: ^1.4.2
  package_info_plus: ^8.0.2
  flutter_markdown: ^0.7.7+1
  http: ^1.2.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  network_info_plus: ^6.1.1
  wifi_scan: ^0.4.1+2
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  dio: ^5.4.3
  multicast_dns: ^0.3.2
  web_socket_channel: ^3.0.3
  connectivity_plus: ^5.0.2
  local_auth: ^2.3.0
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.2
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  sqflite_common_ffi: ^2.3.2+2
  fake_cloud_firestore: ^3.1.0
  image: ^4.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/abi/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/branding/icon-1024.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "lib/assets/branding/icon-foreground.png"

flutter_native_splash:
  color: "#0A0A0A"
  image: "lib/assets/branding/splash-foreground.png"
  android_12:
    image: "lib/assets/branding/splash-android12.png"
    color: "#0A0A0A"
